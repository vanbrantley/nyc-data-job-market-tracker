version: 2

models:
  - name: fct_job_postings
    description: >
      Final wide table of NYC data job postings for the Streamlit dashboard.
      Unions JSearch, TheirStack, and Built In sources; deduplicates cross-source
      matches; joins LLM enrichment; and filters out senior and software-engineer roles.
    columns:
      - name: job_id
        description: Unique identifier from the source API.
        tests:
          - unique
          - not_null

      - name: source
        description: Source API (jsearch, theirstack, builtin).
        tests:
          - not_null
          - accepted_values:
              values: ['jsearch', 'theirstack', 'builtin']

      - name: ingestion_query
        description: >
          The specific query label that produced this row (e.g. "Data Analyst",
          "Analytics Engineer", "Data Engineer"). Null for rows ingested before
          query-level tracking was added.

      - name: job_title
        description: Job title as posted by the employer.
        tests:
          - not_null

      - name: company_name
        description: Hiring company name.

      - name: job_url
        description: Direct link to the job posting.

      - name: date_posted
        description: Date the job was posted, normalized to a plain date (no timezone).

      - name: description
        description: >
          Full job description text. Plain text for all sources — 
          HTML stripped for Built In. Excluded from default display 
          but available for the job detail panel in Streamlit.

      - name: city
        description: City of the job location. Null for fully remote postings (~11%).

      - name: state
        description: State or region code of the job location.

      - name: country
        description: Country code of the job location.

      - name: latitude
        description: Latitude coordinate of the job location.

      - name: longitude
        description: Longitude coordinate of the job location.

      - name: work_model
        description: Work arrangement (remote, hybrid, onsite).
        tests:
          - accepted_values:
              values: ['remote', 'hybrid', 'onsite']

      - name: employment_type
        description: Employment classification (full_time, part_time, contract, other).
        tests:
          - accepted_values:
              values: ['full_time', 'part_time', 'contract', 'other']

      - name: listed_seniority
        description: >
          Seniority level as explicitly labeled by the source. Populated for
          TheirStack (native field) and Built In (scraped from page). NULL for
          JSearch, which has no structured seniority field.

      - name: final_salary_min
        description: >
          Minimum annual salary in USD. Prefers structured payload value; falls
          back to LLM estimate. ~63% coverage. No sanity bounds applied.

      - name: final_salary_max
        description: >
          Maximum annual salary in USD. Prefers structured payload value; falls
          back to LLM estimate. ~63% coverage. No sanity bounds applied.

      - name: early_career_tier
        description: >
          Collapsed seniority grouping for dashboard charts: 'entry_or_junior'
          (combines entry_level + junior, since builtin/theirstack don't reliably
          distinguish these) or 'mid'. Derived from listed_seniority only —
          scoped to builtin and theirstack, which self-report structured
          seniority. NULL for jsearch (no structured seniority field) and for
          any row with listed_seniority outside this scale.

      - name: title_role_bucket
        description: >
          Role classification derived by regex pattern-matching on job_title
          into one of the four target roles (Data Analyst, Data Engineer,
          Analytics Engineer, Data Scientist). Distinct from ingestion_query
          (which search term surfaced the posting — found to mislabel
          Analytics Engineer postings as Data Engineer due
          to JSearch's loose topical matching) and role_archetype (LLM-inferred
          from the full description, used for the title-vs-description
          self-consistency analysis). title_role_bucket reflects only what the
          posting's own title claims to be. Value is 'no_match' when the title
          doesn't cleanly map to any of the four roles; these rows remain in
          the mart rather than being filtered out, so the full dataset stays
          queryable.
        tests:
          - accepted_values:
              values: ['Data Analyst', 'Data Engineer', 'Analytics Engineer', 'Data Scientist', 'no_match']

      - name: inferred_seniority
        description: Seniority level inferred by GPT-4o-mini from the job description.

      - name: role_archetype
        description: >
          High-level role category assigned by LLM (e.g. data_analyst, data_engineer).
          software_engineer rows are excluded from this table.

      - name: work_focus
        description: Primary work focus area inferred by LLM.

      - name: acknowledges_ai
        description: >
          Boolean flag indicating whether the job posting explicitly mentions AI,
          LLMs, or related tools in the context of the role or company's work.

      - name: domain
        description: >
          Industry vertical the company operates in (e.g. finance, healthcare,
          retail, tech, consulting, government). Null for general-purpose or
          indeterminate roles.

      - name: explicitly_encourages_applicants
        description: >
          Boolean flag indicating whether the posting explicitly states that
          candidates who do not meet every requirement are still encouraged to apply.

      - name: tech_stack_required
        description: VARIANT array of required technologies extracted by LLM.

      - name: tech_stack_preferred
        description: VARIANT array of preferred technologies extracted by LLM.

      - name: paradigms_required
        description: VARIANT array of required technical paradigms extracted by LLM.

      - name: paradigms_preferred
        description: VARIANT array of preferred technical paradigms extracted by LLM.

      - name: degree_requirement
        description: Degree requirement level inferred by LLM (e.g. none, bachelors, masters).

      - name: years_required_min
        description: Minimum years of experience required, extracted by LLM.

      - name: years_required_max
        description: Maximum years of experience required, extracted by LLM.

      - name: confidence_score
        description: LLM self-reported confidence score for the enrichment output (0–1).

      - name: enriched_at
        description: Timestamp when the LLM enrichment was written.

      - name: ingested_at
        description: Timestamp when the raw payload was written to Snowflake.
