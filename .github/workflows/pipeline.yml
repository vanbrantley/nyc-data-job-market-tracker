name: NYC Job Market — Data Pipeline

on:
  schedule:
    - cron: "14 10 * * 1,4"  # 10am UTC (6am EDT) every Monday and Thursday (~every 3 days)
  workflow_dispatch:         # allow manual trigger from GitHub UI for testing

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      # - name: Run ingestion pipeline
      #   env:
      #     RAPIDAPI_KEY:        ${{ secrets.RAPIDAPI_KEY }}
      #     THEIRSTACK_KEY:      ${{ secrets.THEIRSTACK_KEY }}
      #     SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      #     SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      #     SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
      #     SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
      #     SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      #     SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
      #     PYTHONPATH:          ${{ github.workspace }}
      #   run: python ingestion/run_ingestion.py

      - name: Run enrichment
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
          OPENAI_KEY:          ${{ secrets.OPENAI_KEY }}
          PYTHONPATH:          ${{ github.workspace }}
        run: python enrichment/run_enrichment.py

      - name: Install dbt dependencies
        run: pip install dbt-snowflake

      - name: Create dbt profiles.yml
        env:
          SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_ROLE:      ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          nyc_job_tracker:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${SNOWFLAKE_ACCOUNT}
                user: ${SNOWFLAKE_USER}
                password: ${SNOWFLAKE_PASSWORD}
                role: ${SNOWFLAKE_ROLE}
                warehouse: ${SNOWFLAKE_WAREHOUSE}
                database: ANALYTICS_PROD
                schema: public
                threads: 4
          EOF

      - name: Install dbt deps
        working-directory: transformation
        run: dbt deps

      - name: Run dbt models
        working-directory: transformation
        run: dbt run

      - name: Run dbt tests
        working-directory: transformation
        continue-on-error: true  # test failures warn but don't kill the pipeline
        run: dbt test